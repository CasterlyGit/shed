name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install uv
        run: pip install uv
      - name: install
        run: uv pip install --system -e ".[dev]"
        env:
          # Force the hash embedder so CI doesn't pull a 400MB model.
          SHED_EMBEDDER: hash
      - name: lint
        run: ruff check src tests
      - name: test
        env:
          SHED_EMBEDDER: hash
        run: pytest -q
